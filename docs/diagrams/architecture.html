  <title id="oneself-architecture-title">OneSelf 架构：开源个人上下文管理</title>
  <desc id="oneself-architecture-desc">所属人通过管理端批准授权、随时收回，也在管理端整理和维护个人上下文；任意 AI Agent 或脚本经所属人批准的 API Key 或 OAuth 2.1 设备码接入 PCP 接口（HTTP 与 MCP 是同一套操作），按授权读写；访客打开公开主页，页面只读取公开内容，换版需要所属人批准。个人上下文由页面和原件组成，按目录授权、默认私有、版本可回退；页面、原件和站点包存进 RustFS，索引、授权和版本存进 PostgreSQL，全部部署在你自己的机器上。</desc>
