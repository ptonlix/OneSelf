  <desc id="oneself-architecture-desc">访客和主人的浏览器打开按指针提供的站点与管理端，页面脚本匿名读取公开 PCP；自己的 Agent 用 API Key、别人的 Agent 用 OAuth 2.1 设备码换来的访问令牌，调用同一份 PCP 操作注册表（HTTP 与 MCP）；单个 Node.js 进程把 Markdown 原文、原件和站点包存进 RustFS，把索引、授权和站点指针存进 PostgreSQL。</desc>
